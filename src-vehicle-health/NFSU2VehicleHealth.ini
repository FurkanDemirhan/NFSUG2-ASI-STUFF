[General]
; Master switch to enable/disable the vehicle health system
EnableHealthSystem = 1

[Gameplay]
; Maximum vehicle health points (default = 100.0)
MaxHealth = 100.0

; Collision damage scaling factor (1.0 = balanced, 2.0 = double damage, 0.5 = half damage)
DamageMultiplier = 1.0

; Minimum collision impact force required to deliver damage (avoids damage on gentle nudges)
MinForceThreshold = 0.50

; When health reaches 0, completely disable engine throttle and reverse (car will coast to a stop)
DisableVehicleOnDeath = 1

; During races, automatically disqualify cars in race status when health reaches 0 (1 = Enabled, 0 = Disabled)
DisqualifyOnDeath = 1

; Disable player health decrease in Free Roam and Career Free Roam (1 = Enabled, 0 = Disabled)
DisablePlayerHealthInFreeRoam = 1

; Disqualification reason: 3 = Knocked Out (Default, works in all race modes), 8 = Blown Engine, 9 = Totalled
DisqualifyReason = 3

[Visuals]
; Display floating 2D health bars projected above vehicle roofs
DisplayHealthBars = 1

; Display health bar for player car (docked at top center of screen)
ShowPlayerBar = 1

; Display health bars floating above AI race opponents
ShowOpponentBars = 1

; Display health bars floating above ambient traffic cars
ShowTrafficBars = 1

; Vertical float height above car in meters (default = 1.85)
HealthBarHeightOffset = 1.85

; Horizontal forward offset along car length in meters (default = 0.0)
HealthBarForwardOffset = 0.0

; Base health bar width in pixels (default = 100)
HealthBarWidth = 100

; Base health bar height in pixels (default = 10)
HealthBarHeight = 10

[Hotkeys]
; Enable debugging hotkeys
EnableHotkeys = 1

; Hotkey to fully repair all vehicles back to 100% health (Default: 0x77 = F8)
HotkeyRepairAll = 119

; Hotkey to damage player vehicle by 25% for quick testing (Default: 0x78 = F9)
HotkeyDamagePlayer = 120
