[Restorations]
; Restores the cut Debug Car Customization screen (UI_DebugCarCustomize.fng) in the Customize Car menu
RestoreDebugCarCustomize = 0

; Restores hidden camera POV modes (Driver, Bumper, Hood, Drift, Chase) and cycles through all 5
RestoreHiddenCameras = 0

; Restores Outrun mode in Quick Race menu, and restores track selection for Free Run and Outrun
RestoreUnusedRaceModes = 0

; Restores AI opponents in Sprint Drift races (previously forced solo)
RestoreSprintDriftOpponents = 0

; Restores the Lap Controller for URL races (previously locked)
RestoreURLLapController = 0

; Restores the "Restart Race" option in the Pause Menu for all modes (including URL and Outrun)
RestoreRestartRaceInAllModes = 0

; Restores the hidden Special Vinyls category (0x1C) in vinyl customization
RestoreSpecialVinyls = 0

; Restores the cut Burnout / Smokeshow mode (fixes track 4097 override crash and options jump table)
RestoreBurnoutMode = 0

; Restores Lap Knockout / GT mode to the Quick Race mode select menu
RestoreLapKOInQR = 0

; Restores cut vehicle damage (wobbling parts for doors, exhaust, trunk, mirrors, and part detachment on heavy collisions)
RestoreVehicleDamage = 0

[Cars]
; Restores the cut regional cars (Peugeot 106 / Opel Corsa) into the Car Lot and Quick
; Race car select and as AI opponents. Adapted from NFSU2 Extra Options "Remove Region
; Car Lock"; only applied for cars whose model data exists on disc (CARS/PEUGOT ships
; on US retail discs, CARS/CORSA was cut entirely).
UnlockRegionalCars = 1

[VehicleDamage]
; Global multiplier for the part wobble motion (0 = rigid, 1 = default, up to 3)
WobbleScale = 0.7

; Per-part hinge pivots in car space (X: +front/-rear, Y: +left/-right, Z: +up).
; These apply ONLY on the car-world-matrix render path; on the per-part-matrix path
; (used while driving) parts always rotate around their own centre - they can never
; detach there. Set all three values to 0 to rotate a part in place on both paths.
; Doors flap around their front hinge; trunk pops on its hinge; mirrors/exhaust vibrate.
PivotMirrorL = 0.0, 0.0, 0.0
PivotMirrorR = 0.0, 0.0, 0.0
PivotExhaust = 0.0, 0.0, 0.0
PivotTrunk = -1.05, 0.0, 0.85
PivotDoorL = 0.68, 0.82, 0.22
PivotDoorR = 0.68, -0.82, 0.22

[DemoCareer]
; Restores the PS2 Demo's RandomEncounterManager "DEACTIVATE_OPPONENT" state (cut from
; the retail build): after a career free-roam outrun encounter ends, the engaged AI
; opponent car is deactivated and returned to the world pool instead of lingering.
RestoreEncounterOpponentCleanup = 1

[Fixes]
; Fixes disappearing/invisible wheels bug in certain camera views
FixDisappearingWheels = 0

; Fixes random fatal 0xC0000005 crash at 0x0073927D in PATH_status due to null/cleared audio bank pointers
FixAudioPathCrash = 0

; Fixes crash when starting Track 4000 (Bayview City) and tracks lacking barrier packages in Circuit / race modes
FixMissingBarriersCrash = 0

; Removes neon locked area barriers in Career mode
RemoveLockedAreaBarriers = 0

[Menu]
; Allows selecting any valid track in any Quick Race mode (safely filters out broken dummy stubs)
UnlockAnyTrackInAnyMode = 0

[Gameplay]
; Removes neon route indicator barriers from race modes (keeps Drift and URL intact)
RemoveRaceBarriers = 0

[Debugging]
; Enables the game's internal Debug World Camera mover
EnableDebugWorldCamera = 0

[Gameplay]
; Enable debugging hotkeys during gameplay
EnableDebugHotkeys = 1

[Hotkeys]
; Virtual key codes (116 = F5, 117 = F6, 118 = F7)
AutoDrive = 117
UnlockAll = 116
DamageCycle = 118 ; F7 - Cycles player damage stages (0=Repaired, 1=Light Wobble, 2=Medium Wobble, 3=Heavy Wobble, 4=Detached)

